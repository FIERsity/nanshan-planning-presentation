<script>
const slides=[{"chapter": 0, "title": "从上海规划，走向身边的环境问题", "deck": "环境规划研究 · 中期汇报", "body": "\n<div class=\"material-map\"><div class=\"map-label\">市域规划<span>上海<\/span><\/div><div class=\"map-docs\"><div class=\"primary-doc\"><small>核心对象<\/small><h3>美丽上海建设“十五五”规划<\/h3><\/div><div class=\"doc-pair\"><span>生态环境保护“十四五”规划<\/span><span>美丽上海三年行动计划<\/span><\/div><\/div><div class=\"map-label\">地方情境<span>杨浦<\/span><\/div><div class=\"map-docs\"><h3>城市更新“十五五”规划<\/h3><p>美丽杨浦行动计划 · 相关建设方案<\/p><\/div><div class=\"map-label last\">实施材料<\/div><div class=\"map-docs last\"><p>环境公报　／　项目绩效　／　建议提案答复<\/p><\/div><\/div><p class=\"closing\">以上海为研究对象，在杨浦寻找可观察的具体任务。<\/p>", "note": "老师好。这次汇报主要介绍三个方面的进展：研究对象转向上海，规划理论框架的完善，以及文章的初步安排。\n\n现在主要研究《美丽上海建设“十五五”规划》。同时，我希望进一步结合杨浦的一些具体任务。杨浦离我们比较近，滨水空间、社区环境和城市更新都能在日常生活中接触到，也方便后续做实地观察、补充材料。\n\n目前收集的资料分成三个层次。第一层是上海市的规划和行动计划，用来理解总体目标及其变化。第二层是杨浦的城市更新规划和美丽建设相关文件，用来寻找具体任务。第三层是环境公报、项目绩效和建议提案答复，用来了解实施情况和实际问题。后面的分析会沿着具体任务，把这些材料联系起来。", "refs": [["s15", "全文"], ["s14", "全文"], ["yang", "全文"], ["yact", "全文"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/70/7065921b1d0d41e5a661d9d580fee96b/15016b289b274acede3c83f797599f19.pdf\" target=\"_blank\" rel=\"noopener\">美丽上海建设“十五五”规划 ↗<\/a>. 2026，沪府发〔2026〕16号。<span class=\"ref-loc\">全文<\/span><\/li><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/d3/d353ca821cbb41e89dd36062c0245e2b/b97fae2407e428add759fa5c7500fed2.pdf\" target=\"_blank\" rel=\"noopener\">上海市生态环境保护“十四五”规划 ↗<\/a>. 2021，沪府发〔2021〕19号。<span class=\"ref-loc\">全文<\/span><\/li><li><span>上海市杨浦区人民政府.<\/span> <a href=\"https://www.shyp.gov.cn/zhengwu/qfb-zfwj/2026/285/5444.html\" target=\"_blank\" rel=\"noopener\">杨浦区推动城市更新“十五五”规划 ↗<\/a>. 2026，第三部分及保障措施。<span class=\"ref-loc\">全文<\/span><\/li><li><span>上海市杨浦区人民政府办公室.<\/span> <a href=\"https://www.shanghai.gov.cn/nw12344/20250102/f5d52f61f0514b8c87c23b5d4f98a1ab.html\" target=\"_blank\" rel=\"noopener\">美丽杨浦建设三年行动计划（2024—2026年） ↗<\/a>. 正式行动计划；市政府网站2025-01-02发布。<span class=\"ref-loc\">全文<\/span><\/li><\/ol><\/section>", "number": 1}, {"chapter": 0, "title": "“两新、四高、一底线”", "deck": "美丽上海建设“十五五”规划 · 全市尺度", "body": "\n<div class=\"plan-meta\"><span><strong>18<\/strong> 项主要指标<\/span><span>城市 · 乡村 · 园区 · 河口海岸<\/span><\/div>\n<div class=\"two-new\"><div><span>两新 / 01<\/span><p>美丽上海建设新格局<\/p><\/div><div><span>两新 / 02<\/span><p>长三角生态环境共保联治新突破<\/p><\/div><\/div>\n<div class=\"four-high\"><div><span>01<\/span><h3>高质量发展<\/h3><p>绿色低碳转型<\/p><\/div><div><span>02<\/span><h3>高水平保护<\/h3><p>全域系统治理<\/p><\/div><div class=\"focus\"><span>03<\/span><h3>高品质生活<\/h3><p>生态资源与生活福祉<\/p><\/div><div class=\"focus\"><span>04<\/span><h3>高效能治理<\/h3><p>改革创新与多元支撑<\/p><\/div><\/div><div class=\"baseline\"><span>一底线<\/span><strong>守牢生态安全底线<\/strong><span class=\"focus-caption\">研究关注：生活品质与治理效能的联系<\/span><\/div>", "note": "这份规划覆盖上海全市，包含中心城区，也包含乡村、产业园区和河口海岸。它把绿色转型、环境质量、人居品质、生态保护、风险防控和治理体系放在同一个整体中。\n\n官方解读将重点任务概括为“两新、四高、一底线”。两新强调全域美丽建设和长三角共保联治；四高分别是高质量发展、高水平保护、高品质生活和高效能治理；底线是生态安全。\n\n我最关注后两个高。高品质生活提出我们希望获得什么样的生态环境，高效能治理涉及怎样组织和支持这些要求的实现。发展和保护仍然是重要基础，文章准备把分析重心放在生活品质与治理条件之间的联系上。\n\n规划本身提供了不少可以分析的内容，包括目标指标、社区和生态空间安排、人才培训、科技转化、监测质量以及评估反馈。这些内容能够与后面介绍的理论框架结合。", "refs": [["s15", "PDF第2—3页及各任务章"], ["interpret", "“两新、四高、一底线”"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/70/7065921b1d0d41e5a661d9d580fee96b/15016b289b274acede3c83f797599f19.pdf\" target=\"_blank\" rel=\"noopener\">美丽上海建设“十五五”规划 ↗<\/a>. 2026，沪府发〔2026〕16号。<span class=\"ref-loc\">PDF第2—3页及各任务章<\/span><\/li><li><span>上海市政府办公厅.<\/span> <a href=\"https://www.shanghai.gov.cn/wzjd/20260910/ba787b1750d84db38eda988675dc85b2.html\" target=\"_blank\" rel=\"noopener\">《美丽上海建设“十五五”规划》解读 ↗<\/a>. 2026-09-10。<span class=\"ref-loc\">“两新、四高、一底线”<\/span><\/li><\/ol><\/section>", "number": 2}, {"chapter": 0, "title": "从既有目标，走向更具体的要求", "deck": "“十四五” → 三年行动 → “十五五”", "body": "\n<div class=\"timeline\"><div><time>2021—2025<\/time><h3>生态环境保护<\/h3><p>绿色发展、生态服务<br>现代环境治理<\/p><\/div><div><time>2024—2026<\/time><h3>“十美”共建<\/h3><p>33项重点任务<br>连接两轮五年规划<\/p><\/div><div><time>2026—2030<\/time><h3>美丽上海建设<\/h3><p>全域协同、主要指标重组<br>生活场景与治理工具细化<\/p><\/div><\/div>\n<div class=\"compare-list\"><div><span>声环境<\/span><p>已有噪声治理任务 <b>→<\/b> 夜间达标率进入主要指标<\/p><\/div><div><span>生态空间<\/span><p>贯通与开放共享 <b>→<\/b> 24小时开放率等要求量化<\/p><\/div><div><span>治理能力<\/span><p>数字化与队伍建设 <b>→<\/b> 应用场景、培训与质量要求细化<\/p><\/div><\/div>\n<p class=\"small-observation\">一个待分析的变化：公众生态环境满意率未继续列入“十五五”主要指标表。<\/p>", "note": "为了判断十五五的变化，我把十四五规划和2024至2026年行动计划放在一起比较。十四五已经提出生活品质、绿色更新、公众参与和现代环境治理。三年行动计划以“十美”组织33项任务，把许多要求进一步细化，也跨越了两轮五年规划。\n\n目前比较清楚的变化有三组。第一，噪声本来就有治理任务，十五五把声环境功能区夜间达标率列入主要指标。第二，生态空间原来已经强调开放共享，十五五进一步提出公园24小时开放率等要求。第三，数字治理和人才建设继续细化，出现了具体应用场景和监测质量要求。\n\n还有一个值得继续分析的变化：十四五主要指标中的公众生态环境满意率，未在十五五主要指标表中保留。这使我更关心，生活品质目标怎样通过指标、任务和评价程序得到反映。\n\n因此，文章准备追踪这些要求的延续和具体化，研究它们如何进入实施过程。", "refs": [["s14", "PDF第9、14、31、37—40页"], ["act", "总体要求与重点任务"], ["s15", "PDF第3、13、17—19页"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/d3/d353ca821cbb41e89dd36062c0245e2b/b97fae2407e428add759fa5c7500fed2.pdf\" target=\"_blank\" rel=\"noopener\">上海市生态环境保护“十四五”规划 ↗<\/a>. 2021，沪府发〔2021〕19号。<span class=\"ref-loc\">PDF第9、14、31、37—40页<\/span><\/li><li><span>上海市人民政府办公厅.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/b0/b0a33eaa837443ccb487685de17789d8/151fce8db603f025c0ba158beac8000c.pdf\" target=\"_blank\" rel=\"noopener\">美丽上海建设三年行动计划（2024—2026年） ↗<\/a>. 2024，沪府办发〔2024〕16号。<span class=\"ref-loc\">总体要求与重点任务<\/span><\/li><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/70/7065921b1d0d41e5a661d9d580fee96b/15016b289b274acede3c83f797599f19.pdf\" target=\"_blank\" rel=\"noopener\">美丽上海建设“十五五”规划 ↗<\/a>. 2026，沪府发〔2026〕16号。<span class=\"ref-loc\">PDF第3、13、17—19页<\/span><\/li><\/ol><\/section>", "number": 3}, {"chapter": 0, "title": "在杨浦，寻找规划与行动的联系", "deck": "地方材料如何进入研究", "body": "\n<div class=\"columns three\"><article class=\"column\"><span class=\"ordinal\">01<\/span><h3>城市更新规划<\/h3><p>生态治理、滨水空间<br>完整社区、数智绿建<\/p><\/article><article class=\"column\"><span class=\"ordinal\">02<\/span><h3>美丽杨浦行动<\/h3><p>地方生态环境任务<br>部门协作与阶段安排<\/p><\/article><article class=\"column\"><span class=\"ordinal\">03<\/span><h3>实施过程材料<\/h3><p>项目绩效、提案答复<br>人员、维护与反馈记录<\/p><\/article><\/div>\n<div class=\"yangpu-scene\"><span class=\"scene-label\">可观察的场景<\/span><strong>滨水空间<\/strong><span>—<\/span><strong>社区环境<\/strong><span>—<\/span><strong>生态空间开放<\/strong><\/div>\n<p class=\"closing\">把市域目标放到具体场景中，追踪任务、主体和运行条件。<\/p>", "note": "杨浦材料主要承担把总体问题落到具体场景中的作用。\n\n城市更新十五五规划中，生态治理、滨水开放空间、完整社区、公园环境和数智绿建都有相应部署。例如，滨水空间既涉及生态环境，也涉及慢行、公共活动和日常管理；社区更新则把住房、服务、公共空间和绿色运行组织在一起。\n\n美丽杨浦三年行动计划可以补充地方生态环境任务。另有一份全面推进美丽杨浦建设行动方案，当前取得的是送审稿，引用时会保留版本说明。\n\n公报、项目绩效和提案答复提供另一类信息：谁在实施，投入了什么，运行中遇到了哪些问题，公众意见怎样处理。我希望选择能在这些文件间追踪的任务，再结合身边的观察展开分析。上海和杨浦两份规划之间的具体联系，也会在任务层面逐项核对。", "refs": [["yang", "第三部分：重点任务"], ["yact", "地方任务与实施安排"], ["ydraft", "送审稿"], ["proposal", "开放空间管理相关内容"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>上海市杨浦区人民政府.<\/span> <a href=\"https://www.shyp.gov.cn/zhengwu/qfb-zfwj/2026/285/5444.html\" target=\"_blank\" rel=\"noopener\">杨浦区推动城市更新“十五五”规划 ↗<\/a>. 2026，第三部分及保障措施。<span class=\"ref-loc\">第三部分：重点任务<\/span><\/li><li><span>上海市杨浦区人民政府办公室.<\/span> <a href=\"https://www.shanghai.gov.cn/nw12344/20250102/f5d52f61f0514b8c87c23b5d4f98a1ab.html\" target=\"_blank\" rel=\"noopener\">美丽杨浦建设三年行动计划（2024—2026年） ↗<\/a>. 正式行动计划；市政府网站2025-01-02发布。<span class=\"ref-loc\">地方任务与实施安排<\/span><\/li><li><span>杨浦区.<\/span> <a href=\"https://www.shyp.gov.cn/zhengwu/zwgk-zdjc2024/2025/219/bc94d453015bc206e88c53de58582af9/7cf9d7de5ee54649bf45358f429a8e64.pdf\" target=\"_blank\" rel=\"noopener\">全面推进美丽杨浦建设行动方案 ↗<\/a>. 送审稿，版本以公开材料标注为准。<span class=\"ref-loc\">送审稿<\/span><\/li><li><span>杨浦区相关部门.<\/span> <a href=\"https://www.shyp.gov.cn/oarest9/epointtemp/xxgkfile/data/nfsshare/BigFileUpLoadStorage/temp/2024-04-02/7eb2bf90-f38a-4c44-a05e-e6f58e077163/%E6%AD%A3%E5%BC%8F%E7%A8%BF.pdf\" target=\"_blank\" rel=\"noopener\">区政协0276号提案会办意见 ↗<\/a>. 2024，开放空间管理、人员与培训相关内容。<span class=\"ref-loc\">开放空间管理相关内容<\/span><\/li><\/ol><\/section>", "number": 4}, {"chapter": 1, "title": "规划怎样进入行动？", "deck": "从文本内容，进入规划作用过程", "body": "\n<div class=\"question-lead\">目标与指标提出之后，<br><em>行动需要怎样的条件？<\/em><\/div>\n<div class=\"process-band\"><div><small>规划表达<\/small><strong>提出要求<\/strong><\/div><i>→<\/i><div><small>空间 · 时间 · 关系<\/small><strong>组织任务<\/strong><\/div><i>→<\/i><div><small>主体条件与互动<\/small><strong>形成行动<\/strong><\/div><i>→<\/i><div><small>环境与生活<\/small><strong>观察结果<\/strong><\/div><\/div>\n<div class=\"feedback-line\">监测 · 执行信息 · 公众表达 <span>↶ 进入评价与调整<\/span><\/div>", "note": "接下来介绍理论框架。上次老师指出，可以围绕一个规划作用的总体框架来组织文章。我回去以后，重点梳理了规划实施、时空行为、主体互动和能力方面的研究。\n\n上海材料中可以看到，规划既提出目标，也安排空间、任务、部门协作、人才与科技支持，最后还有评估和公众反馈。把这些内容联系起来，就会遇到一个核心问题：目标提出之后，行动需要怎样的条件？\n\n我目前的理解是，可以先辨认规划表达了什么，再看任务怎样在空间、时间和关系上组织，以及主体是否具备相应的认识、意愿、能力和资源。随后，观察行动作用于哪些对象、产生什么结果，最后通过评价反馈进入下一轮调整。\n\n这页展示的是阅读规划的基本线索。后面的完整框架会进一步区分这些内容，并画出相互作用的关系。", "refs": [["hers", "规划意图、治理与土地变化的关系"], ["bao", "时间性、空间性、复杂性及制度—行动关系"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>Hersperger, A. M., et al..<\/span> <a href=\"https://doi.org/10.1016/j.gloenvcha.2018.05.001\" target=\"_blank\" rel=\"noopener\">Urban land-use change: The role of strategic spatial planning ↗<\/a>. Global Environmental Change, 2018, 51: 32–42；DOI: 10.1016/j.gloenvcha.2018.05.001。<span class=\"ref-loc\">规划意图、治理与土地变化的关系<\/span><\/li><li><span>包存宽.<\/span> <a href=\"https://doi.org/10.16619/j.cnki.rmltxsqy.2023.02.009\" target=\"_blank\" rel=\"noopener\">基于场域优化管控的风险治理新范式 ↗<\/a>. 人民论坛·学术前沿，2023（2）；DOI: 10.16619/j.cnki.rmltxsqy.2023.02.009。<span class=\"ref-loc\">时间性、空间性、复杂性及制度—行动关系<\/span><\/li><\/ol><\/section>", "number": 5}, {"chapter": 1, "title": "三组文献，支撑三层理解", "deck": "理论框架的主要依据", "body": "\n<div class=\"literature-rows\"><article><div class=\"lit-index\">01<\/div><div><h3>规划如何组织时空关系<\/h3><p>包存宽（2023） · 王德、胡杨（2022）<\/p><\/div><div class=\"lit-insight\">活动有空间联系，也有日常节律与实施周期。<\/div><\/article><article><div class=\"lit-index\">02<\/div><div><h3>主体为什么行动、能否行动<\/h3><p>Bressers（2009） · Wu et al.（2015）<\/p><\/div><div class=\"lit-insight\">认知与动机影响选择，能力、权限和资源支持行动。<\/div><\/article><article><div class=\"lit-index\">03<\/div><div><h3>需求怎样进入实施与调整<\/h3><p>谌丽等（2025）<\/p><\/div><div class=\"lit-insight\">公众信息经过分析、决策与反馈，形成行动依据。<\/div><\/article><\/div>\n<p class=\"small-observation\">据此综合形成分析框架：时空关系、主体条件与评价反馈相互联系。<\/p>", "note": "这里选了三组与框架最直接相关的文献。\n\n第一组帮助我理解规划的调控维度。包老师关于场域的文章讨论了时间性、空间性和复杂性，以及制度和行动的关系。王德、胡杨的时空行为规划研究，把空间、时间和行为联系起来。我结合老师的指导，把这一层组织为空间组织、时间统筹和关系协调，关注活动在哪里、何时发生，以及不同主体和任务怎样相互关联。\n\n第二组帮助我理解主体条件。Bressers的情境互动分析关注主体的认知、动机、能力与权力。Wu等人的政策能力研究进一步区分分析、运作和政治能力，以及个人、组织和系统层次。由此，我保留了理念与认知、动机与意愿、知识与能力、权限与资源四组观察内容。\n\n第三组是谌丽等关于数字化公众参与和城市体检的研究。它把公众需求、数据分析、更新行动和反馈联系起来，也启发我关注：信息被收集之后，怎样进入实际决策。\n\n这些研究分别帮助我解释框架中的不同联系，完整结构是结合研究问题作出的综合。", "refs": [["bao", "理论理解"], ["wang", "第2节及图3"], ["bressers", "第5节与主体互动图"], ["wu", "能力类型与层次"], ["chen", "第2、5节"]], "cls": "literature-slide", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>包存宽.<\/span> <a href=\"https://doi.org/10.16619/j.cnki.rmltxsqy.2023.02.009\" target=\"_blank\" rel=\"noopener\">基于场域优化管控的风险治理新范式 ↗<\/a>. 人民论坛·学术前沿，2023（2）；DOI: 10.16619/j.cnki.rmltxsqy.2023.02.009。<span class=\"ref-loc\">理论理解<\/span><\/li><li><span>王德，胡杨.<\/span> <a href=\"https://doi.org/10.16361/j.upf.202201006\" target=\"_blank\" rel=\"noopener\">城市时空行为规划：概念、框架与展望 ↗<\/a>. 城市规划学刊，2022（1）：44–50；DOI: 10.16361/j.upf.202201006。<span class=\"ref-loc\">第2节及图3<\/span><\/li><li><span>Bressers, H..<\/span> <a href=\"https://research.utwente.nl/en/publications/from-public-administration-to-policy-networks-contextual-interact/\" target=\"_blank\" rel=\"noopener\">From public administration to policy networks: Contextual interaction analysis ↗<\/a>. In Rediscovering Public Law and Public Administration in Comparative Policy Analysis, 2009: 123–142；专著章节。<span class=\"ref-loc\">第5节与主体互动图<\/span><\/li><li><span>Wu, X.; Ramesh, M.; Howlett, M..<\/span> <a href=\"https://doi.org/10.1016/j.polsoc.2015.09.001\" target=\"_blank\" rel=\"noopener\">Policy capacity: A conceptual framework for understanding policy competences and capabilities ↗<\/a>. Policy and Society, 2015, 34(3–4): 165–171；DOI: 10.1016/j.polsoc.2015.09.001。<span class=\"ref-loc\">能力类型与层次<\/span><\/li><li><span>谌丽，李杨，何炬.<\/span> <a href=\"https://doi.org/10.11821/dlyj020240888\" target=\"_blank\" rel=\"noopener\">数字化公众参与在城市体检中的理论与实践探索 ↗<\/a>. 地理研究，2025，44（5）：1189–1206；DOI: 10.11821/dlyj020240888。<span class=\"ref-loc\">第2、5节<\/span><\/li><\/ol><\/section>", "number": 6}, {"chapter": 1, "title": "环境规划作用分析框架", "deck": "从规划表达，到行动条件与评价反馈", "body": "\n<div class=\"framework-tools\"><div class=\"focus-buttons\" aria-label=\"框架阅读顺序\"><button class=\"selected\" data-focus=\"all\">完整框架<\/button><button data-focus=\"path\">作用过程<\/button><button data-focus=\"actor\">主体条件<\/button><button data-focus=\"feedback\">评价反馈<\/button><\/div><a href=\"assets/framework-v5.svg\" target=\"_blank\" rel=\"noopener\">打开原图 ↗<\/a><\/div>\n<div class=\"framework-scroll\"><div class=\"framework-canvas\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1520\" height=\"665\" viewBox=\"40 140 1520 665\"><title>环境规划作用分析框架 V5<\/title><defs><marker id=\"a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#454545\"/><\/marker><\/defs><rect width=\"1520\" he ll=\"white\" stroke=\"#555\" stroke-width=\"1.5\"/>\n<text x=\"665\" y=\"483\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"600\">关系协调<\/text>\n<text x=\"1020\" y=\"205\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"600\">规划作用过程<\/text>\n<rect x=\"810\" y=\"235\" width=\"420\" height=\"325\" rx=\"8\" fill=\"#fafafa\" stroke=\"#b7b7b7\" stroke-width=\"1.5\"/>\n<rect x=\"835\" y=\"270\" width=\"370\" height=\"140\" rx=\"8\" fill=\"white\" stroke=\"#555\" stroke-width=\"1.5\"/>\n<text x=\"1020\" y=\"304\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\">主体条件<\/text>\n<text x=\"930\" y=\"348\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"400\">理念与认知<\/text>\n<text x=\"1110\" y=\"348\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"400\">动机与意愿<\/text>\n<text x=\"930\" y=\"385\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"400\">知识与能力<\/text>\n<text x=\"1110\" y=\"385\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"400\">权限与资源<\/text>\n<rect x=\"835\" y=\"455\" width=\"150\" height=\"70\" rx=\"8\" fill=\"white\" stroke=\"#555\" stroke-width=\"1.5\"/>\n<text x=\"910\" y=\"498\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\">行动<\/text>\n<rect x=\"1045\" y=\"455\" width=\"160\" height=\"70\" rx=\"8\" fill=\"white\" stroke=\"#555\" stroke-width=\"1.5\"/>\n<text x=\"1125\" y=\"498\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"600\">作用对象<\/text>\n<path d=\"M 910 410 V 455\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\"/>\n<path d=\"M 985 490 H 1045\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\" marker-start=\"url(#a)\"/>\n<text x=\"1440\" y=\"265\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"600\">实施结果<\/text>\n<rect x=\"1340\" y=\"305\" width=\"200\" height=\"190\" rx=\"8\" fill=\"white\" stroke=\"#555\" stroke-width=\"1.5\"/>\n<text x=\"1440\" y=\"350\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"400\">任务完成情况<\/text>\n<text x=\"1440\" y=\"400\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"400\">环境与生态变化<\/text>\n<text x=\"1440\" y=\"450\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"400\">发展与生活影响<\/text>\n<path d=\"M 310 400 H 350\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\"/>\n<path d=\"M 750 400 H 810\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\"/>\n<path d=\"M 1230 400 H 1340\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\"/>\n<path d=\"M 90 305 V 160 H 1170 V 270\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\"/>\n<text x=\"605\" y=\"151\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"400\">直接作用<\/text>\n<rect x=\"610\" y=\"665\" width=\"500\" height=\"90\" rx=\"8\" fill=\"white\" stroke=\"#555\" stroke-width=\"1.5\"/>\n<text x=\"860\" y=\"702\" text-anchor=\"middle\" font-size=\"25\" font-weight=\"600\">监测 · 评价 · 反馈<\/text>\n<text x=\"860\" y=\"735\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\">监测结果　执行信息　公众表达<\/text>\n<path d=\"M 1440 495 V 710 H 1110\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\"/>\n<path d=\"M 860 665 V 610\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\"/>\n<path d=\"M 190 610 H 1020\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\"/>\n<path d=\"M 190 610 V 495\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#a)\"/>\n<path d=\"M 550 610 V 560\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#a)\"/>\n<path d=\"M 1020 610 V 560\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" stroke-dasharray=\"6 5\" marker-end=\"url(#a)\"/>\n<text x=\"720\" y=\"599\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"400\">反馈调整<\/text>\n<path d=\"M 290 495 V 795 H 860 V 755\" fill=\"none\" stroke=\"#555\" stroke-width=\"1.7\" marker-end=\"url(#a)\"/>\n<text x=\"475\" y=\"786\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"400\">目标对照<\/text>\n<text x=\"800\" y=\"838\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"400\">V5 · 理论框架讨论稿<\/text>\n<\/g><rect class=\"focus-mask actor-mask\" x=\"815\" y=\"242\" width=\"410\" height=\"305\" fill=\"none\" stroke=\"#557565\" stroke-width=\"3\" rx=\"10\"/><path class=\"focus-mask feedback-mask\" d=\"M160 575H1125V815H270V495\" fill=\"none\" stroke=\"#557565\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/><path class=\"focus-mask path-mask\" d=\"M70 225H1535V565H70Z\" fill=\"none\" stroke=\"#557565\" stroke-width=\"3\" stroke-dasharray=\"8 8\"/><\/svg><\/div><\/div><p class=\"framework-caption\" id=\"frameworkCaption\">规划表达提出要求；调控维度组织条件；主体行动作用于对象；评价反馈支持调整。<\/p>", "note": "这就是目前整理出的完整框架。\n\n第一框是规划表达，包括理念与原则、目标与指标、实施安排。它们共同说明规划追求什么、怎样组织落实。\n\n第二框是规划调控维度，用三角结构表示空间组织、时间统筹和关系协调。三者经常同时发生作用。比如开放空间的使用既涉及位置和连通，也涉及开放与维护时间，还涉及管理者、使用者和周边居民之间的关系。\n\n第三框是规划作用过程，包含主体条件、行动和作用对象。这里尤其关注主体是否理解任务、愿意投入、具备知识能力，并拥有相应权限和资源。规划中的培训、责任配置和支持政策也可以直接影响主体条件，所以保留了上方的直接作用路径。\n\n右侧把实施结果分为任务完成情况、环境与生态变化、发展与生活影响。下方通过目标对照，结合监测结果、执行信息和公众表达开展评价。反馈可以调整规划表达，也可以调整空间、时间和关系安排，以及主体行动的条件。\n\n下一步会用上海的具体任务，逐项分析这些联系。", "refs": [["hers", "规划作用过程"], ["bressers", "主体条件与互动"], ["wang", "时空行为联系"], ["chen", "公众信息与评价反馈"]], "cls": "framework-slide", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>Hersperger, A. M., et al..<\/span> <a href=\"https://doi.org/10.1016/j.gloenvcha.2018.05.001\" target=\"_blank\" rel=\"noopener\">Urban land-use change: The role of strategic spatial planning ↗<\/a>. Global Environmental Change, 2018, 51: 32–42；DOI: 10.1016/j.gloenvcha.2018.05.001。<span class=\"ref-loc\">规划作用过程<\/span><\/li><li><span>Bressers, H..<\/span> <a href=\"https://research.utwente.nl/en/publications/from-public-administration-to-policy-networks-contextual-interact/\" target=\"_blank\" rel=\"noopener\">From public administration to policy networks: Contextual interaction analysis ↗<\/a>. In Rediscovering Public Law and Public Administration in Comparative Policy Analysis, 2009: 123–142；专著章节。<span class=\"ref-loc\">主体条件与互动<\/span><\/li><li><span>王德，胡杨.<\/span> <a href=\"https://doi.org/10.16361/j.upf.202201006\" target=\"_blank\" rel=\"noopener\">城市时空行为规划：概念、框架与展望 ↗<\/a>. 城市规划学刊，2022（1）：44–50；DOI: 10.16361/j.upf.202201006。<span class=\"ref-loc\">时空行为联系<\/span><\/li><li><span>谌丽，李杨，何炬.<\/span> <a href=\"https://doi.org/10.11821/dlyj020240888\" target=\"_blank\" rel=\"noopener\">数字化公众参与在城市体检中的理论与实践探索 ↗<\/a>. 地理研究，2025，44（5）：1189–1206；DOI: 10.11821/dlyj020240888。<span class=\"ref-loc\">公众信息与评价反馈<\/span><\/li><\/ol><\/section>", "number": 7}, {"chapter": 1, "title": "用“生态空间开放共享”试读框架", "deck": "任务示例 · 美丽上海规划PDF第13页", "body": "\n<div class=\"example-target\"><span>规划中的明确要求<\/span><strong>公园24小时开放率提高到90%以上<\/strong><p>推进单位附属绿色空间开放共享<\/p><\/div>\n<div class=\"columns three example-columns\"><article class=\"column\"><span class=\"ordinal\">空间<\/span><h3>哪里开放<\/h3><p>入口、连通、服务范围<\/p><\/article><article class=\"column\"><span class=\"ordinal\">时间<\/span><h3>怎样持续使用<\/h3><p>开放时段、养护周期<\/p><\/article><article class=\"column\"><span class=\"ordinal\">关系<\/span><h3>谁共同参与<\/h3><p>管理单位、使用者、周边居民<\/p><\/article><\/div>\n<div class=\"example-bottom\"><div><small>进一步追踪主体条件<\/small><p>管理权限 · 维护人员 · 专业支持 · 经费来源<\/p><\/div><div><small>评价观察<\/small><p>开放完成 → 使用与环境变化 → 居民反馈<\/p><\/div><\/div>", "note": "这页用生态空间开放共享做一个试读。规划提出公园24小时开放率提高到90%以上，并进一步推动单位附属绿色空间开放共享。\n\n先看空间组织：开放哪些地方，入口和通行怎样安排，服务范围是什么。再看时间统筹：开放时段如何覆盖居民活动，日常养护和夜间管理怎样衔接。关系协调则涉及管理单位、使用者和周边居民，他们对公共使用、安全和安静可能有不同考虑。\n\n继续向下，就需要追踪主体条件：谁有权决定开放规则，谁承担维护，人员和经费如何安排，是否有专业支持。评价也可以分层观察，从开放任务是否完成，到使用和环境发生了什么变化，再到居民意见怎样进入管理调整。\n\n目前这项任务用于展示框架的用法。图中提出的人员、经费和使用情况，是接下来需要从相关文件和实地材料中继续查找的内容。", "refs": [["s15", "PDF第13页：建设生态宜居家园"], ["yang", "公园城市与完整社区相关任务"], ["proposal", "开放空间管理、人员与培训"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/70/7065921b1d0d41e5a661d9d580fee96b/15016b289b274acede3c83f797599f19.pdf\" target=\"_blank\" rel=\"noopener\">美丽上海建设“十五五”规划 ↗<\/a>. 2026，沪府发〔2026〕16号。<span class=\"ref-loc\">PDF第13页：建设生态宜居家园<\/span><\/li><li><span>上海市杨浦区人民政府.<\/span> <a href=\"https://www.shyp.gov.cn/zhengwu/qfb-zfwj/2026/285/5444.html\" target=\"_blank\" rel=\"noopener\">杨浦区推动城市更新“十五五”规划 ↗<\/a>. 2026，第三部分及保障措施。<span class=\"ref-loc\">公园城市与完整社区相关任务<\/span><\/li><li><span>杨浦区相关部门.<\/span> <a href=\"https://www.shyp.gov.cn/oarest9/epointtemp/xxgkfile/data/nfsshare/BigFileUpLoadStorage/temp/2024-04-02/7eb2bf90-f38a-4c44-a05e-e6f58e077163/%E6%AD%A3%E5%BC%8F%E7%A8%BF.pdf\" target=\"_blank\" rel=\"noopener\">区政协0276号提案会办意见 ↗<\/a>. 2024，开放空间管理、人员与培训相关内容。<span class=\"ref-loc\">开放空间管理、人员与培训<\/span><\/li><\/ol><\/section>", "number": 8}, {"chapter": 2, "title": "生活品质要求，如何获得治理支持？", "deck": "初步研究构想", "body": "\n<p class=\"research-question\">在城市内涵式发展背景下，<br>上海环境规划如何回应高品质生活的生态环境需求，<br><em>并通过相应的治理安排推动其实现？<\/em><\/p>\n<div class=\"columns three research-questions\"><article class=\"column\"><span class=\"ordinal\">01<\/span><h3>需求进入规划<\/h3><p>怎样表达为目标、指标与任务？<\/p><\/article><article class=\"column\"><span class=\"ordinal\">02<\/span><h3>规划组织行动<\/h3><p>怎样形成主体行动的条件？<\/p><\/article><article class=\"column\"><span class=\"ordinal\">03<\/span><h3>评价支持调整<\/h3><p>怎样观察结果并回应反馈？<\/p><\/article><\/div><div class=\"context-strip\">城市内涵式发展 <span>／<\/span> 存量提质与持续运行 <span>／<\/span> 高品质生活 · 高效能治理<\/div>", "note": "基于前面的材料和框架，文章目前形成了这样一个初步构想：在城市内涵式发展背景下，上海环境规划如何回应高品质生活的生态环境需求，并通过相应的治理安排推动其实现？\n\n城市内涵式发展提供了研究情境。既有空间怎样更好地使用，设施怎样持续运行，不同功能和主体怎样协调，都与生活品质密切相关。国家十五五纲要和中央城市工作会议中的相关部署，也使这些问题更加突出。《国家发展规划法》和《生态环境法典》提供规划制度与生态环境治理的规范背景，正文会围绕具体问题使用相关条款。\n\n研究重点放在四高中的后两个高：生活品质说明要回应什么需要，治理效能要求我们分析实现这些目标的条件。\n\n具体分成三个问题。第一，生态环境需要怎样进入规划目标、指标与任务；第二，规划怎样组织行动，并支持主体具备相应条件；第三，怎样观察实施结果，让监测和公众反馈进入调整。这三个问题也构成文章的基本顺序。", "refs": [["national", "第三十一章"], ["city", "城市内涵式发展、治理投入与统筹协调"], ["ecode", "规划与生态环境分区管控"], ["plaw", "规划衔接、资源支持与监测评估"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>中华人民共和国.<\/span> <a href=\"https://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/2026/2026_zt03/yw/202603/t20260314_1430877.html\" target=\"_blank\" rel=\"noopener\">国民经济和社会发展第十五个五年规划纲要 ↗<\/a>. 2026，第三十一章。<span class=\"ref-loc\">第三十一章<\/span><\/li><li><span>中央城市工作会议.<\/span> <a href=\"https://www.mee.gov.cn/ywdt/szyw/202507/t20250715_1123471.shtml\" target=\"_blank\" rel=\"noopener\">中央城市工作会议在北京举行 ↗<\/a>. 2025-07-15，新华社报道。<span class=\"ref-loc\">城市内涵式发展、治理投入与统筹协调<\/span><\/li><li><span>全国人民代表大会.<\/span> <a href=\"https://www.mee.gov.cn/ywgz/fgbz/fl/202603/t20260313_1146496.shtml\" target=\"_blank\" rel=\"noopener\">中华人民共和国生态环境法典 ↗<\/a>. 2026，第一编第三章。<span class=\"ref-loc\">规划与生态环境分区管控<\/span><\/li><li><span>全国人民代表大会.<\/span> <a href=\"https://qspfw.moe.gov.cn/html/sublaws/20260313/23924.html\" target=\"_blank\" rel=\"noopener\">中华人民共和国国家发展规划法 ↗<\/a>. 2026，第四条、第二十四条、第二十七至二十八条。<span class=\"ref-loc\">规划衔接、资源支持与监测评估<\/span><\/li><\/ol><\/section>", "number": 9}, {"chapter": 2, "title": "文章沿着问题展开", "deck": "预期章节安排", "body": "\n<div class=\"outline\"><div><span>01<\/span><h3>引言<\/h3><p>时代情境与研究问题<\/p><\/div><div><span>02<\/span><h3>理论基础与分析框架<\/h3><p>需求、主体条件与规划作用<\/p><\/div><div><span>03<\/span><h3>研究设计<\/h3><p>材料、任务选择与分析方法<\/p><\/div><div class=\"outline-main\"><span>04<\/span><h3>生活品质需求的表达与演变<\/h3><p>跨期比较目标、指标和任务<\/p><\/div><div class=\"outline-main\"><span>05<\/span><h3>行动组织与评价反馈<\/h3><p>空间时间关系、主体条件与调整<\/p><\/div><div><span>06<\/span><h3>讨论<\/h3><p>生活品质导向下的规划治理要求<\/p><\/div><div><span>07<\/span><h3>结论<\/h3><p>回应研究问题与后续研究<\/p><\/div><\/div>", "note": "文章准备按照这个顺序展开。\n\n引言提出问题，理论部分解释分析视角，研究设计交代材料和任务选择。正文重点是第四、第五章。\n\n第四章分析生活品质需求的表达与演变。通过十四五、三年行动和十五五的对读，辨认哪些要求延续下来，哪些变得更具体，再分析它们分别进入了什么指标和任务。\n\n第五章研究行动组织与评价反馈。选择几组具体任务，追踪空间、时间和关系安排怎样联系主体条件，以及实施结果如何被观察和反馈。最后的讨论，再从这些发现中提炼环境规划的治理要求。\n\n这个组织方式借鉴了几篇文章。谌丽等将理论框架接到参与方式、信息应用和反馈路径；张文忠从不同尺度的问题导向相应更新路径；田莉等通过主体关系和制度安排解释实施困难。我希望借鉴它们把理论与具体问题连接起来的写法，让正文分析成为文章的重心。", "refs": [["chen", "理论框架—实施方式—信息应用—反馈路径"], ["zhang", "尺度分析与更新路径"], ["tian", "理论逻辑、实施模式与案例分析"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>谌丽，李杨，何炬.<\/span> <a href=\"https://doi.org/10.11821/dlyj020240888\" target=\"_blank\" rel=\"noopener\">数字化公众参与在城市体检中的理论与实践探索 ↗<\/a>. 地理研究，2025，44（5）：1189–1206；DOI: 10.11821/dlyj020240888。<span class=\"ref-loc\">理论框架—实施方式—信息应用—反馈路径<\/span><\/li><li><span>张文忠.<\/span> <a href=\"https://doi.org/10.11821/dlyj020240909\" target=\"_blank\" rel=\"noopener\">基于多尺度城市体检的城市更新路径研究 ↗<\/a>. 地理研究，2025，44（5）：1175–1188；DOI: 10.11821/dlyj020240909。<span class=\"ref-loc\">尺度分析与更新路径<\/span><\/li><li><span>田莉，陶然，梁印龙.<\/span> <a href=\"https://upforum.wupen.org/Data/Download/816?type=z\" target=\"_blank\" rel=\"noopener\">城市更新困局下的实施模式转型：基于空间治理的视角 ↗<\/a>. 城市规划学刊，2020（3）：41–47。<span class=\"ref-loc\">理论逻辑、实施模式与案例分析<\/span><\/li><\/ol><\/section>", "number": 10}, {"chapter": 2, "title": "以具体任务连接材料", "deck": "研究步骤与当前进展", "body": "\n<div class=\"status-row\"><span class=\"status-label\">已有基础<\/span><p>规划全文与实施材料　·　跨期对照　·　理论框架<\/p><\/div>\n<div class=\"work-flow\"><div><span>01<\/span><h3>识别需求<\/h3><p>目标 · 指标 · 任务<\/p><\/div><i>→<\/i><div><span>02<\/span><h3>追踪安排<\/h3><p>时空关系 · 主体条件<\/p><\/div><i>→<\/i><div><span>03<\/span><h3>核对过程<\/h3><p>行动 · 结果 · 反馈<\/p><\/div><\/div>\n<div class=\"candidate-row\"><span>候选任务<\/span><p>生态空间开放共享<br>群众身边河湖治理<\/p><p class=\"candidate-aside\">结合杨浦寻找具体记录<br>按材料完整度确定样本<\/p><\/div>\n<p class=\"closing\">下一步：完成任务证据表，补充实地观察与必要访谈。<\/p>", "note": "现在已经完成了主要规划和一批实施材料的收集，做了十四五和十五五的初步对照，理论框架也形成了当前版本。\n\n下一步准备以具体任务为单位组织材料。先识别相关生活品质要求，再查找任务的空间、时间和主体安排，接着用项目记录、提案答复、绩效资料等核对实施过程。\n\n候选任务包括生态空间开放共享和群众身边河湖治理。前者便于分析使用时段、管理关系和持续维护，后者可以观察环境指标、生态状态与居民感受之间的联系。具体样本会根据材料的完整程度确定，并尽量在杨浦找到可进一步观察的场景。\n\n证据整理时，会把规划部署、实施记录和结果材料分别标明。主体意愿、协商过程和日常使用情况，可以通过实地观察和必要访谈补充。这样能逐步判断框架中哪些联系已经有材料支持，哪些还需要继续调查。", "refs": [["s15", "PDF第8—9、13、17—19页"], ["yang", "生态治理与公共空间任务"], ["bulletin", "环境状态资料"], ["proposal", "地方实施资料"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>上海市人民政府.<\/span> <a href=\"https://www.shanghai.gov.cn/cmsres/70/7065921b1d0d41e5a661d9d580fee96b/15016b289b274acede3c83f797599f19.pdf\" target=\"_blank\" rel=\"noopener\">美丽上海建设“十五五”规划 ↗<\/a>. 2026，沪府发〔2026〕16号。<span class=\"ref-loc\">PDF第8—9、13、17—19页<\/span><\/li><li><span>上海市杨浦区人民政府.<\/span> <a href=\"https://www.shyp.gov.cn/zhengwu/qfb-zfwj/2026/285/5444.html\" target=\"_blank\" rel=\"noopener\">杨浦区推动城市更新“十五五”规划 ↗<\/a>. 2026，第三部分及保障措施。<span class=\"ref-loc\">生态治理与公共空间任务<\/span><\/li><li><span>上海市生态环境局.<\/span> <a href=\"https://sthj.sh.gov.cn/cmsres/17/17f73ef0f3474f2896027bb2cc33434b/ab78e00d8a18d52c971dfc2ead9d9a17.pdf\" target=\"_blank\" rel=\"noopener\">2025上海市生态环境状况公报 ↗<\/a>. 2026发布。<span class=\"ref-loc\">环境状态资料<\/span><\/li><li><span>杨浦区相关部门.<\/span> <a href=\"https://www.shyp.gov.cn/oarest9/epointtemp/xxgkfile/data/nfsshare/BigFileUpLoadStorage/temp/2024-04-02/7eb2bf90-f38a-4c44-a05e-e6f58e077163/%E6%AD%A3%E5%BC%8F%E7%A8%BF.pdf\" target=\"_blank\" rel=\"noopener\">区政协0276号提案会办意见 ↗<\/a>. 2024，开放空间管理、人员与培训相关内容。<span class=\"ref-loc\">地方实施资料<\/span><\/li><\/ol><\/section>", "number": 11}, {"chapter": 2, "title": "希望进一步讨论的三个问题", "deck": "研究范围 · 案例层次 · 证据深度", "body": "\n<div class=\"discussion-list\"><article><span>01<\/span><div><h3>研究范围怎样收得更合适？<\/h3><p>生活品质需求与治理实现条件，是否还应收窄到一类任务？<\/p><\/div><\/article><article><span>02<\/span><div><h3>上海与杨浦怎样结合？<\/h3><p>市域规划为主，杨浦作为具体任务情境，还是进一步形成案例研究？<\/p><\/div><\/article><article><span>03<\/span><div><h3>哪些环节最需要补充证据？<\/h3><p>文本与公开材料之外，优先观察或访谈哪些主体与过程？<\/p><\/div><\/article><\/div>\n<div class=\"closing-end\"><span>下一阶段<\/span><strong>确定任务样本，推进正文分析。<\/strong><a href=\"notes.html\">查看完整讲稿 ↗<\/a><\/div>", "note": "最后，希望请老师重点指导三个问题。\n\n第一个是研究范围。以生活品质的生态环境需求及其治理实现条件为主线，目前是否已经足够集中，还是需要进一步收窄到一类任务？长三角共保联治也有鲜明特点，目前准备把它作为总体情境，在任务确实涉及跨界联系时再深入展开。\n\n第二个是上海和杨浦的结合方式。目前倾向以上海规划为主，在杨浦寻找具体任务和实施材料。这样的安排是否合适，还是应当进一步确定一个杨浦案例，让研究更集中？\n\n第三个是证据深度。现在已有规划文本和公开实施材料，下一步哪些主体和过程最值得通过观察、访谈补充，能够帮助文章形成更有解释力的分析？\n\n框架会随着具体材料的分析继续调整。接下来希望先把任务样本和证据关系做实，再推进文章正文。以上是这次的研究进展，请老师指导。", "refs": [["liu", "框架的操作化与案例演示"], ["zhang", "问题尺度与研究路径"]], "cls": "", "citations": "<section class=\"page-sources\" aria-label=\"本页引用\"><div class=\"sources-label\">本页依据<\/div><ol><li><span>刘佳燕，冉奥博.<\/span> <a href=\"https://tucsu.tsinghua.edu.cn/info/1042/2617.htm\" target=\"_blank\" rel=\"noopener\">社区更新中的空间治理：一个“空间—产权—制度”耦合分析框架 ↗<\/a>. 西部人居环境学刊，2026年第3期；本次依据作者机构转载正文。<span class=\"ref-loc\">框架的操作化与案例演示<\/span><\/li><li><span>张文忠.<\/span> <a href=\"https://doi.org/10.11821/dlyj020240909\" target=\"_blank\" rel=\"noopener\">基于多尺度城市体检的城市更新路径研究 ↗<\/a>. 地理研究，2025，44（5）：1175–1188；DOI: 10.11821/dlyj020240909。<span class=\"ref-loc\">问题尺度与研究路径<\/span><\/li><\/ol><\/section>", "number": 12}];

let page=0;

function slideHTML(s,i){return `<section class="slide ${s.cls}" data-page="${i+1}" aria-labelledby="title-${i}"><div class="slide-heading"><div><p class="eyebrow">${esc(s.deck)}</p><h1 id="title-${i}">${esc(s.title)}</h1></div><span class="page-watermark" aria-hidden="true">${String(i+1).padStart(2,'0')}</span></div><div class="slide-body">${s.body}</div>${s.citations}</section>`}
function notes(){const s=slides[page];$('notePage').textContent=`第 ${page+1} 页 / ${slides.length}`;$('noteTitle').textContent=s.title;$('noteContent').innerHTML=s.note.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}
function render(){const s=slides[page];$('main').innerHTML=slideHTML(s,page);$('counter').innerHTML=`<strong>${String(page+1).padStart(2,'0')}</strong><span>/ ${slides.length}</span>`;$('chapterName').textContent=chapterNames[s.chapter];$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;document.querySelectorAll('[data-chapter]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.chapter)===s.chapter);b.setAttribute('aria-current',Number(b.dataset.chapter)===s.chapter?'step':'false')});document.querySelectorAll('[data-page-button]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.pageButton)===page);b.setAttribute('aria-current',Number(b.dataset.pageButton)===page?'page':'false')});document.title=`${page+1}. ${s.title}｜上海环境规划研究`;notes();initFramework()}
function go(n){const next=Math.max(0,Math.min(slides.length-1,n));page=next;history.replaceState(null,'','#'+(page+1));render();window.scrollTo({top:0,behavior:'instant'})}
function initFramework(){document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const focus=b.dataset.focus;document.querySelectorAll('[data-focus]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});document.querySelector('.framework-canvas').dataset.focus=focus;const text={all:'规划表达提出要求；调控维度组织条件；主体行动作用于对象；评价反馈支持调整。',path:'沿主轴阅读：规划表达 → 调控维度 → 主体行动与作用对象 → 实施结果。',actor:'主体条件：理念与认知、动机与意愿、知识与能力、权限与资源。',feedback:'以目标为参照，结合监测结果、执行信息和公众表达，调整规划与行动。'};$('frameworkCaption').textContent=text[focus]})}
$('dots').innerHTML=slides.map((s,i)=>`<button data-page-button="${i}" aria-label="第${i+1}页：${esc(s.title)}"></button>`).join('');
$('tocItems').innerHTML=chapterNames.map((ch,c)=>`<h3>${['I','II','III'][c]}　${ch}</h3><div class="toc-group">${slides.map((s,i)=>s.chapter===c?`<button data-jump="${i}"><span>${String(i+1).padStart(2,'0')}</span>${esc(s.title)}</button>`:'').join('')}</div>`).join('');

document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>go(slides.findIndex(s=>s.chapter===Number(b.dataset.chapter))));
$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('noteButton').onclick=()=>{$('notesDialog').showModal();$('notesDialog').scrollTop=0};$('tocButton').onclick=()=>$('tocDialog').showModal();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
$('fullButton').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('fullButton').textContent='浏览器全屏'}};
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.ctrlKey||e.altKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(page+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(page-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}else if(e.key.toLowerCase()==='n')$('noteButton').click()});
window.addEventListener('hashchange',()=>{page=parsePage();render();window.scrollTo(0,0)});
let printMode=false;window.addEventListener('beforeprint',()=>{printMode=true;$('main').innerHTML=slides.map(slideHTML).join('')});window.addEventListener('afterprint',()=>{printMode=false;render()});
page=parsePage();render();
</script></body></html>
